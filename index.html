<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgriHealthAI — AI-powered guidance for smart agriculture, better food awareness and healthier everyday living. Fully bilingual (English & हिन्दी).">
  <title data-i18n="meta.title">AgriHealthAI — Smart Agriculture, Better Food, Healthier Choices</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="home">
  <div id="site-nav"></div>

  <main id="main">
    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="container">
        <div class="hero__grid">
          <div>
            <span class="eyebrow" data-i18n="home.statLangTitle"></span>
            <h1 data-i18n-html="home.heroTitle"></h1>
            <p class="lead" data-i18n="home.heroSub"></p>
            <p class="hero__tagline-hi" data-i18n="home.heroHi"></p>
            <div class="hero__cta">
              <a class="btn btn--primary btn--lg" href="agriculture.html" data-i18n="home.ctaPrimary"></a>
              <a class="btn btn--secondary btn--lg" href="about.html" data-i18n="home.ctaSecondary"></a>
            </div>
          </div>
          <div class="hero__media">
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1100&q=70"
                 data-i18n-attr="alt:img.heroFarm" alt="" width="1100" height="880" fetchpriority="high">
            <div class="hero__badge"><span class="dot"></span><span data-i18n="home.heroBadge"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ FEATURES ============ -->
    <section class="section section--white">
      <div class="container">
        <div class="section-head center reveal">
          <span class="eyebrow" data-i18n="home.featuresEyebrow"></span>
          <h2 data-i18n="home.featuresTitle"></h2>
          <p class="lead" data-i18n="home.featuresSub"></p>
        </div>
        <div class="grid grid--3">
          <article class="card reveal">
            <img class="card__media" src="https://images.unsplash.com/photo-1574943320219-553eb213f72d?auto=format&fit=crop&w=800&q=70"
                 data-i18n-attr="alt:img.cardAgri" alt="" loading="lazy">
            <div class="card__body">
              <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21c0-6 4-9 9-9-1 6-5 9-9 9Z"/><path d="M12 21c0-6-4-9-9-9 1 6 5 9 9 9Z"/></svg></div>
              <h3 data-i18n="home.f1Title"></h3>
              <p data-i18n="home.f1Text"></p>
              <a class="card__link" href="agriculture.html"><span data-i18n="home.f1Cta"></span> &rarr;</a>
            </div>
          </article>
          <article class="card reveal">
            <img class="card__media" src="https://images.unsplash.com/photo-1518843875459-f738682238a6?auto=format&fit=crop&w=800&q=70"
                 data-i18n-attr="alt:img.cardFood" alt="" loading="lazy">
            <div class="card__body">
              <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18M3 12h4a4 4 0 0 0 4-4V3M7 12V3M17 21V3c-3 1-5 4-5 8 0 2 1 3 2 3h3Z"/></svg></div>
              <h3 data-i18n="home.f2Title"></h3>
              <p data-i18n="home.f2Text"></p>
              <a class="card__link" href="scanner.html"><span data-i18n="home.f2Cta"></span> &rarr;</a>
            </div>
          </article>
          <article class="card reveal">
            <img class="card__media" src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=800&q=70"
                 data-i18n-attr="alt:img.cardHealth" alt="" loading="lazy">
            <div class="card__body">
              <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg></div>
              <h3 data-i18n="home.f3Title"></h3>
              <p data-i18n="home.f3Text"></p>
              <a class="card__link" href="health.html"><span data-i18n="home.f3Cta"></span> &rarr;</a>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- ============ HOW IT WORKS ============ -->
    <section class="section">
      <div class="container">
        <div class="section-head center reveal">
          <span class="eyebrow" data-i18n="home.howEyebrow"></span>
          <h2 data-i18n="home.howTitle"></h2>
          <p class="lead" data-i18n="home.howSub"></p>
        </div>
        <div class="steps">
          <div class="step reveal"><div class="step__num"></div><h3 data-i18n="home.howStep1"></h3><p class="muted" data-i18n="home.howStep1Text"></p></div>
          <div class="step reveal"><div class="step__num"></div><h3 data-i18n="home.howStep2"></h3><p class="muted" data-i18n="home.howStep2Text"></p></div>
          <div class="step reveal"><div class="step__num"></div><h3 data-i18n="home.howStep3"></h3><p class="muted" data-i18n="home.howStep3Text"></p></div>
          <div class="step reveal"><div class="step__num"></div><h3 data-i18n="home.howStep4"></h3><p class="muted" data-i18n="home.howStep4Text"></p></div>
        </div>
      </div>
    </section>

    <!-- ============ PROBLEMS ============ -->
    <section class="section section--mint">
      <div class="container">
        <div class="section-head center reveal">
          <span class="eyebrow" data-i18n="home.problemsEyebrow"></span>
          <h2 data-i18n="home.problemsTitle"></h2>
          <p class="lead" data-i18n="home.problemsSub"></p>
        </div>
        <div class="grid grid--2">
          <div class="card reveal"><div class="card__body">
            <div class="badge-row" style="margin-bottom:12px"><span class="badge">01</span></div>
            <p data-i18n="home.prob1" style="margin:0"></p>
          </div></div>
          <div class="card reveal"><div class="card__body">
            <div class="badge-row" style="margin-bottom:12px"><span class="badge">02</span></div>
            <p data-i18n="home.prob2" style="margin:0"></p>
          </div></div>
          <div class="card reveal"><div class="card__body">
            <div class="badge-row" style="margin-bottom:12px"><span class="badge">03</span></div>
            <p data-i18n="home.prob3" style="margin:0"></p>
          </div></div>
          <div class="card reveal"><div class="card__body">
            <div class="badge-row" style="margin-bottom:12px"><span class="badge">04</span></div>
            <p data-i18n="home.prob4" style="margin:0"></p>
          </div></div>
        </div>
      </div>
    </section>

    <!-- ============ WORKFLOW ============ -->
    <section class="section section--white">
      <div class="container">
        <div class="section-head center reveal">
          <span class="eyebrow" data-i18n="home.workflowEyebrow"></span>
          <h2 data-i18n="home.workflowTitle"></h2>
          <p class="lead" data-i18n="home.workflowSub"></p>
        </div>
        <div class="flow reveal">
          <div class="flow__node">
            <img class="ic" style="object-fit:cover" src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=400&q=70" data-i18n-attr="alt:img.workflowFarm" alt="" loading="lazy">
            <h3 data-i18n="home.wfAgri"></h3><p class="muted" data-i18n="home.wfAgriText"></p>
          </div>
          <div class="flow__arrow" aria-hidden="true">&rarr;</div>
          <div class="flow__node">
            <img class="ic" style="object-fit:cover" src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400&q=70" data-i18n-attr="alt:img.workflowFood" alt="" loading="lazy">
            <h3 data-i18n="home.wfFood"></h3><p class="muted" data-i18n="home.wfFoodText"></p>
          </div>
          <div class="flow__arrow" aria-hidden="true">&rarr;</div>
          <div class="flow__node">
            <img class="ic" style="object-fit:cover" src="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=400&q=70" data-i18n-attr="alt:img.workflowHealth" alt="" loading="lazy">
            <h3 data-i18n="home.wfHealth"></h3><p class="muted" data-i18n="home.wfHealthText"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ HONESTY ============ -->
    <section class="section">
      <div class="container">
        <div class="grid grid--3">
          <div class="card reveal"><div class="card__body">
            <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/><path d="M9 12l2 2 4-4"/></svg></div>
            <h3 data-i18n="home.statSafeTitle"></h3><p data-i18n="home.statSafeText"></p>
          </div></div>
          <div class="card reveal"><div class="card__body">
            <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
            <h3 data-i18n="home.statLangTitle"></h3><p data-i18n="home.statLangText"></p>
          </div></div>
          <div class="card reveal"><div class="card__body">
            <div class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
            <h3 data-i18n="home.statHonestTitle"></h3><p data-i18n="home.statHonestText"></p>
          </div></div>
        </div>
      </div>
    </section>

    <!-- ============ FINAL CTA ============ -->
    <section class="section section--mint">
      <div class="container">
        <div class="card reveal" style="overflow:hidden">
          <div class="grid" style="grid-template-columns:1.1fr .9fr; gap:0">
            <div class="card__body" style="padding:clamp(28px,5vw,52px)">
              <h2 data-i18n="home.ctaTitle"></h2>
              <p class="lead" data-i18n="home.ctaSub"></p>
              <a class="btn btn--primary btn--lg" href="agriculture.html" data-i18n="home.ctaBtn"></a>
            </div>
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=70"
                 style="height:100%;object-fit:cover;min-height:260px" data-i18n-attr="alt:img.ctaField" alt="" loading="lazy">
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="toast-root"></div>

  <script defer src="js/services/cropService.js"></script>
  <script defer src="js/services/nutritionService.js"></script>
  <script defer src="js/services/foodVisionService.js"></script>
  <script defer src="js/services/healthGuidanceService.js"></script>
  <script defer src="js/components/layout.js"></script>
  <script defer src="js/pages/home.js"></script>
